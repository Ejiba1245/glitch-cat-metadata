    <path d="M370 340 L392 341 L382 355 Z" fill="#00f5d4"/>
    <path d="M430 340 L408 341 L418 355 Z" fill="#00f5d4"/>

    <path d="M397 368 L406 368 L414 410 L390 410 Z" fill="#0c1629"/>
    <path d="M357 392 L295 448 L332 446 L370 424 Z" fill="#0d1323"/>
    <path d="M443 392 L505 448 L468 446 L430 424 Z" fill="#0d1323"/>

    <path d="M335 470 L392 522 L415 522 L470 470 L456 510 L400 540 L358 510 Z" fill="#0b1022" opacity="0.9"/>
    <path d="M318 472 L364 500 L335 545 L283 528 Z" fill="#f5f8ff" opacity="0.92"/>
