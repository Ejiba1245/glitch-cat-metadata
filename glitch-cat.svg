    <path d="M509 478 L483 512 L495 560 L533 550 Z" fill="#ff4fd8" opacity="0.85"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.85">
    <path d="M192 190 L250 140 L280 190 L230 230 Z" fill="#00f5d4" opacity="0.9"/>
    <path d="M608 190 L552 140 L522 190 L572 230 Z" fill="#ff4fd8" opacity="0.9"/>
    <path d="M120 580 L260 500 L240 610 L130 660 Z" fill="#7bffb7" opacity="0.7"/>
    <path d="M680 580 L540 500 L560 610 L670 660 Z" fill="#8a7dff" opacity="0.7"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="650" font-size="82" font-weight="900" fill="url(#neon)" letter-spacing="8">GLITCH</text>
    <text x="400" y="705" font-size="22" font-weight="700" fill="#d7edff" letter-spacing="7">CAT // DEVNET</text>
  </g>

  <g opacity="0.7">
    <rect x="180" y="155" width="440" height="4" fill="#00f5d4"/>
    <rect x="180" y="175" width="440" height="4" fill="#ff4fd8"/>
    <rect x="180" y="195" width="440" height="4" fill="#8a7dff"/>
