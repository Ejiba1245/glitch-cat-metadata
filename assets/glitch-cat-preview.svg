<svg viewBox="0 0 512 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .preview-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; }
      .label { font-size: 14px; fill: #666; }
      .title { font-size: 18px; font-weight: 700; fill: #00513E; }
    </style>
  </defs>
  
  <!-- Light background section -->
  <rect x="0" y="0" width="256" height="300" fill="#F5F5F5"/>
  
  <!-- Dark background section -->
  <rect x="256" y="0" width="256" height="300" fill="#101412"/>
  
  <!-- Light background title -->
  <text x="128" y="25" text-anchor="middle" class="label">Light Background</text>
  
  <!-- Logo on light background -->
  <svg x="38" y="50" width="180" height="180" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <style>
        .logo-primary { fill: #00513E; }
        .logo-accent { fill: #B7F34A; }
        .logo-highlight { fill: #FFFFFF; }
      </style>
    </defs>
    <g>
      <circle cx="128" cy="130" r="72" class="logo-primary"/>
      <path d="M 85 75 L 70 35 L 95 70 Q 90 75 85 75" class="logo-primary"/>
      <path d="M 171 75 L 186 35 L 161 70 Q 166 75 171 75" class="logo-primary"/>
      <path d="M 82 65 L 75 48 L 82 62" class="logo-accent"/>
      <path d="M 174 65 L 181 48 L 174 62" class="logo-accent"/>
      <ellipse cx="128" cy="145" rx="28" ry="32" class="logo-highlight"/>
      <path d="M 128 140 L 125 150 L 131 150 Z" class="logo-primary"/>
      <path d="M 128 150 Q 120 158 115 156" stroke="#00513E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 128 150 Q 136 158 141 156" stroke="#00513E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="110" cy="115" rx="12" ry="15" class="logo-highlight"/>
      <ellipse cx="146" cy="115" rx="12" ry="15" class="logo-highlight"/>
      <ellipse cx="110" cy="120" rx="7" ry="10" class="logo-primary"/>
      <ellipse cx="146" cy="120" rx="7" ry="10" class="logo-primary"/>
      <circle cx="108" cy="113" r="3" class="logo-accent"/>
      <circle cx="144" cy="113" r="3" class="logo-accent"/>
      <line x1="100" y1="130" x2="70" y2="125" stroke="#00513E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="98" y1="140" x2="65" y2="145" stroke="#00513E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="156" y1="130" x2="186" y2="125" stroke="#00513E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="158" y1="140" x2="191" y2="145" stroke="#00513E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>
  </svg>
  
  <!-- Dark background title -->
  <text x="384" y="25" text-anchor="middle" class="label" fill="#AAA">Dark Background</text>
  
  <!-- Logo on dark background -->
  <svg x="294" y="50" width="180" height="180" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <style>
        .logo-primary-dark { fill: #B7F34A; }
        .logo-accent-dark { fill: #FFFFFF; }
        .logo-highlight-dark { fill: #101412; }
      </style>
    </defs>
    <g>
      <circle cx="128" cy="130" r="72" class="logo-primary-dark"/>
      <path d="M 85 75 L 70 35 L 95 70 Q 90 75 85 75" class="logo-primary-dark"/>
      <path d="M 171 75 L 186 35 L 161 70 Q 166 75 171 75" class="logo-primary-dark"/>
      <path d="M 82 65 L 75 48 L 82 62" class="logo-accent-dark"/>
      <path d="M 174 65 L 181 48 L 174 62" class="logo-accent-dark"/>
      <ellipse cx="128" cy="145" rx="28" ry="32" class="logo-highlight-dark"/>
      <path d="M 128 140 L 125 150 L 131 150 Z" class="logo-primary-dark"/>
      <path d="M 128 150 Q 120 158 115 156" stroke="#B7F34A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 128 150 Q 136 158 141 156" stroke="#B7F34A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="110" cy="115" rx="12" ry="15" class="logo-highlight-dark"/>
      <ellipse cx="146" cy="115" rx="12" ry="15" class="logo-highlight-dark"/>
      <ellipse cx="110" cy="120" rx="7" ry="10" class="logo-primary-dark"/>
      <ellipse cx="146" cy="120" rx="7" ry="10" class="logo-primary-dark"/>
      <circle cx="108" cy="113" r="3" class="logo-accent-dark"/>
      <circle cx="144" cy="113" r="3" class="logo-accent-dark"/>
      <line x1="100" y1="130" x2="70" y2="125" stroke="#B7F34A" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="98" y1="140" x2="65" y2="145" stroke="#B7F34A" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="156" y1="130" x2="186" y2="125" stroke="#B7F34A" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="158" y1="140" x2="191" y2="145" stroke="#B7F34A" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>
  </svg>
  
  <!-- Brand name -->
  <text x="256" y="265" text-anchor="middle" class="title">Glitch Cat (GLITCH)</text>
</svg>